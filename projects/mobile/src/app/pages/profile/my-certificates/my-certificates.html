<app-back-button /><h1 class="page-title">My certificates</h1>

@if (meApi.certificates().length === 0) {
  <p class="empty-note">You haven't earned any certificates yet.</p>
} @else {
  <app-pill-tabs [options]="filterOptions" [active]="filter()" (activeChange)="setFilter($event)" />

  @if (filteredCertificates().length === 0) {
    <p class="empty-note">No certificates in this filter.</p>
  }
  <div class="row-list">
    @for (c of filteredCertificates(); track c.id) {
      <a [routerLink]="['/certificate', c.id]" class="row">
        <div class="row-title">{{ titleFor(c) }}</div>
        <div class="row-meta">{{ c.certificateNo }}</div>
      </a>
    }
  </div>
}
