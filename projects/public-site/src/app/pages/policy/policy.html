<section class="pad policy-hero">
  <div class="policy-inner">
    <div class="eyebrow">Legal</div>
    <h1 class="policy-title">Privacy Policy</h1>
    <p class="policy-lead">{{ lead() }}</p>
    <p class="policy-updated">Last updated: {{ lastUpdated() }}</p>
  </div>
</section>

<section class="pad policy-body">
  <div class="policy-inner policy-layout">
    <nav class="policy-toc" aria-label="Table of contents">
      <div class="policy-toc-title">On this page</div>
      @for (s of sections(); track s.id; let i = $index) {
        <a [href]="'#' + s.id" (click)="goTo($event, s.id)">{{ i + 1 }}. {{ s.title }}</a>
      }
    </nav>

    <div class="policy-content">
      @for (s of sections(); track s.id; let i = $index) {
        <section [id]="s.id" class="policy-section">
          <h2 class="policy-h2">{{ i + 1 }}. {{ s.title }}</h2>
          <div class="policy-body-html" [innerHTML]="s.bodyHtml"></div>
        </section>
      }
    </div>
  </div>
</section>
