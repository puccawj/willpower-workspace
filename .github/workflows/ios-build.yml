name: iOS build → TestFlight

# Runs on a free macOS runner (public repo = unlimited minutes) — no local Mac needed.
# Trigger manually until secrets are configured; add `push: { branches: [main], paths: [...] }`
# once the first successful TestFlight upload confirms everything is wired up correctly.
on:
  workflow_dispatch:
    inputs:
      bootstrap_certs:
        description: "One-time: generate + push the initial signing certificate to the match repo"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect now rejects uploads built with an SDK older than the current
        # requirement (Apple ties this to the newest Xcode). The runner's *default* Xcode
        # lags behind, but newer versions are usually already installed at /Applications —
        # this picks the newest one actually present instead of a hardcoded version number.
        run: sudo xcode-select -s /Applications/$(ls /Applications | grep '^Xcode_' | sort -V | tail -1)/Contents/Developer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        # npm ci fails here: package-lock.json was generated on Windows, where npm doesn't
        # resolve the macOS-only optional peer deps of @napi-rs/wasm-runtime (@emnapi/*),
        # so npm ci's strict lockfile match rejects it on this macOS runner. npm install
        # resolves whatever the current platform actually needs instead of requiring an
        # exact match.
        run: npm install

      - name: Build mobile web bundle
        run: npx ng build mobile --configuration production

      - name: Sync Capacitor iOS (copies the web build into the Xcode project)
        run: npx cap sync ios

      - name: Build for iOS Simulator (for Appetize.io browser testing)
        # Separate from the App Store build below: simulator builds need no code signing
        # at all (CODE_SIGNING_ALLOWED=NO), so this doesn't touch match/certificates and
        # can't be broken by anything in that pipeline. Appetize can only stream a
        # simulator build (a zipped .app), not the real-device App Store .ipa the beta
        # lane produces — those are built for entirely different architectures/signing.
        working-directory: ios
        run: |
          xcodebuild -project App/App.xcodeproj -scheme App -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            -destination "generic/platform=iOS Simulator"
          cd build/Build/Products/Debug-iphonesimulator
          zip -r App.zip App.app

      - name: Upload to Appetize.io for browser testing
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          response=$(curl -sS https://api.appetize.io/v1/apps -X POST \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@App.zip" \
            -F "platform=ios")
          echo "$response"
          public_key=$(echo "$response" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).publicKey")
          echo "### 📱 Appetize.io test link" >> $GITHUB_STEP_SUMMARY
          echo "https://appetize.io/app/$public_key" >> $GITHUB_STEP_SUMMARY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ios
          bundler-cache: true

      - name: Bootstrap signing certificate (manual, one-time)
        if: ${{ inputs.bootstrap_certs }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: "false"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: bundle exec fastlane ios bootstrap_certs

      - name: Build and upload to TestFlight
        if: ${{ !inputs.bootstrap_certs }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
        run: bundle exec fastlane ios beta
