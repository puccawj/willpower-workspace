name: iOS build → TestFlight

# Runs on a free macOS runner (public repo = unlimited minutes) — no local Mac needed.
# Trigger manually until secrets are configured; add `push: { branches: [main], paths: [...] }`
# once the first successful TestFlight upload confirms everything is wired up correctly.
on:
  workflow_dispatch:
    inputs:
      bootstrap_certs:
        description: "One-time: generate + push the initial signing certificate to the match repo"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect now rejects uploads built with an SDK older than the current
        # requirement (Apple ties this to the newest Xcode). The runner's *default* Xcode
        # lags behind, but newer versions are usually already installed at /Applications —
        # this picks the newest one actually present instead of a hardcoded version number.
        run: sudo xcode-select -s /Applications/$(ls /Applications | grep '^Xcode_' | sort -V | tail -1)/Contents/Developer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        # npm ci fails here: package-lock.json was generated on Windows, where npm doesn't
        # resolve the macOS-only optional peer deps of @napi-rs/wasm-runtime (@emnapi/*),
        # so npm ci's strict lockfile match rejects it on this macOS runner. npm install
        # resolves whatever the current platform actually needs instead of requiring an
        # exact match.
        run: npm install

      - name: Build mobile web bundle
        run: npx ng build mobile --configuration production

      - name: Sync Capacitor iOS (copies the web build into the Xcode project)
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ios
          bundler-cache: true

      - name: Bootstrap signing certificate (manual, one-time)
        if: ${{ inputs.bootstrap_certs }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: "false"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: bundle exec fastlane ios bootstrap_certs

      - name: Build and upload to TestFlight
        if: ${{ !inputs.bootstrap_certs }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
        run: bundle exec fastlane ios beta
