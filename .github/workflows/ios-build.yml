name: iOS build → TestFlight

# Runs on a free macOS runner (public repo = unlimited minutes) — no local Mac needed.
# Trigger manually until secrets are configured; add `push: { branches: [main], paths: [...] }`
# once the first successful TestFlight upload confirms everything is wired up correctly.
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "What to build"
        type: choice
        options:
          - testflight
          - adhoc
          - bootstrap_certs
        default: testflight

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect now rejects uploads built with an SDK older than the current
        # requirement (Apple ties this to the newest Xcode). The runner's *default* Xcode
        # lags behind, but newer versions are usually already installed at /Applications —
        # this picks the newest one actually present instead of a hardcoded version number.
        run: sudo xcode-select -s /Applications/$(ls /Applications | grep '^Xcode_' | sort -V | tail -1)/Contents/Developer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        # npm ci fails here: package-lock.json was generated on Windows, where npm doesn't
        # resolve the macOS-only optional peer deps of @napi-rs/wasm-runtime (@emnapi/*),
        # so npm ci's strict lockfile match rejects it on this macOS runner. npm install
        # resolves whatever the current platform actually needs instead of requiring an
        # exact match.
        run: npm install

      - name: Build mobile web bundle
        run: npx ng build mobile --configuration production

      - name: Sync Capacitor iOS (copies the web build into the Xcode project)
        run: npx cap sync ios

      - name: Cache Swift Package Manager dependencies
        # ios/App/CapApp-SPM/Package.swift is regenerated fresh by `cap sync ios` every run,
        # declaring several remote packages (Capacitor core, Firebase, MLKit barcode
        # scanning, native biometric, social login) — with no cache, cold resolution can run
        # past gym's internal `xcodebuild -showBuildSettings` preflight timeout later in this
        # workflow. Keyed on the resolved manifest so a dependency bump invalidates it.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift Package dependencies
        # Forces package resolution to finish here, with this step's own generous timeout,
        # instead of leaving it to happen lazily inside fastlane's `build_app` — where gym's
        # `-showBuildSettings` preflight has only a ~12s budget (3s × 4 retries) and fails
        # outright ("timed out after 4 retries") if resolution is still in progress.
        working-directory: ios
        timeout-minutes: 10
        run: xcodebuild -resolvePackageDependencies -project App/App.xcodeproj -scheme App

      - name: Build for iOS Simulator (for Appetize.io browser testing)
        # Separate from the App Store build below: simulator builds need no code signing
        # at all (CODE_SIGNING_ALLOWED=NO), so this doesn't touch match/certificates and
        # can't be broken by anything in that pipeline. Appetize can only stream a
        # simulator build (a zipped .app), not the real-device App Store .ipa the beta
        # lane produces — those are built for entirely different architectures/signing.
        working-directory: ios
        run: |
          xcodebuild -project App/App.xcodeproj -scheme App -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            -destination "generic/platform=iOS Simulator"
          cd build/Build/Products/Debug-iphonesimulator
          zip -r App.zip App.app

      - name: Upload to Appetize.io for browser testing
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          response=$(curl -sS https://api.appetize.io/v1/apps -X POST \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@App.zip" \
            -F "platform=ios")
          echo "$response"
          public_key=$(echo "$response" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).publicKey")
          echo "### 📱 Appetize.io test link" >> $GITHUB_STEP_SUMMARY
          echo "https://appetize.io/app/$public_key" >> $GITHUB_STEP_SUMMARY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ios
          bundler-cache: true

      - name: Bootstrap signing certificate (manual, one-time)
        if: ${{ inputs.build_target == 'bootstrap_certs' }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: "false"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: bundle exec fastlane ios bootstrap_certs

      - name: Build and upload to TestFlight
        if: ${{ inputs.build_target == 'testflight' }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          # Defense-in-depth on top of the explicit pre-resolve step above: gym's internal
          # `xcodebuild -showBuildSettings` preflight otherwise gives up after ~12s
          # (3s × 4 retries), which is tight if the runner is just being slow that day.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
        run: bundle exec fastlane ios beta

      - name: Build Ad Hoc .ipa for registered test devices
        # Installs directly on devices registered in ADHOC_DEVICES (Fastfile), bypassing
        # TestFlight entirely — for devices stuck on an iOS version too old for the
        # TestFlight app itself (it requires iOS 16+; this app's own minimum is iOS 15).
        if: ${{ inputs.build_target == 'adhoc' }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
        run: bundle exec fastlane ios adhoc

      - name: Publish Ad Hoc build to our own server
        # Uploads the signed .ipa plus a manifest.plist over HTTPS to a token-gated
        # endpoint on the production API (see api/src/adhoc-upload/), which writes them
        # into the same server's /adhoc/ nginx location. Not SSH/scp: this runner's IP
        # can't reach the server's SSH port at all (it's locked to specific IPs, and
        # GitHub-hosted runners' IPs change every run) — confirmed by a real "Operation
        # timed out" failure. Opening the itms-services:// link this step prints in
        # Safari on a registered device triggers a native install prompt directly.
        if: ${{ inputs.build_target == 'adhoc' }}
        working-directory: ios
        env:
          ADHOC_UPLOAD_TOKEN: ${{ secrets.ADHOC_UPLOAD_TOKEN }}
        run: |
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://wpusa.online/adhoc/App.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>org.willpowerinstitute.app</string>
                  <key>bundle-version</key>
                  <string>${{ github.run_number }}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Willpower Institute (Ad Hoc)</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # iOS Safari generally refuses itms-services:// links typed/pasted directly
          # into the address bar — only ones tapped from an actual page work reliably.
          # This tiny page is that page: a plain HTML link, no JS needed.
          cat > install.html <<HTML
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Install Willpower Institute (Ad Hoc)</title></head>
          <body style="font-family:-apple-system,sans-serif;text-align:center;padding:60px 20px;">
            <h1>Willpower Institute</h1>
            <p>Ad Hoc test build — tap below on this device to install.</p>
            <p>
              <a href="itms-services://?action=download-manifest&amp;url=https://wpusa.online/adhoc/manifest.plist"
                 style="display:inline-block;padding:14px 28px;background:#c6a24a;color:#fff;
                        text-decoration:none;border-radius:8px;font-weight:600;">
                Install
              </a>
            </p>
            <p style="color:#888;font-size:13px;">Must be opened in Safari, not Chrome or another browser.</p>
          </body>
          </html>
          HTML

          curl -sS -f -X POST -H "Authorization: Bearer $ADHOC_UPLOAD_TOKEN" \
            -F "file=@build/App.ipa" https://api.wpusa.online/internal/adhoc-upload/App.ipa
          curl -sS -f -X POST -H "Authorization: Bearer $ADHOC_UPLOAD_TOKEN" \
            -F "file=@manifest.plist" https://api.wpusa.online/internal/adhoc-upload/manifest.plist
          curl -sS -f -X POST -H "Authorization: Bearer $ADHOC_UPLOAD_TOKEN" \
            -F "file=@install.html" https://api.wpusa.online/internal/adhoc-upload/install.html

          echo "### 📲 Ad Hoc install link" >> $GITHUB_STEP_SUMMARY
          echo "Open this on the registered device's **Safari** (not Chrome) and tap **Install** — typing the raw itms-services:// link into the address bar directly won't work on iOS:" >> $GITHUB_STEP_SUMMARY
          echo "https://wpusa.online/adhoc/install.html" >> $GITHUB_STEP_SUMMARY
